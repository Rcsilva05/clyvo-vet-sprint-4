services:
  solin-db:
    image: postgres:16-alpine
    container_name: solin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solindb
      POSTGRES_USER: solin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solin123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - solin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solin -d solindb"]
      interval: 5s
      timeout: 5s
      retries: 10

  solin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solin-app
    restart: unless-stopped
    profiles: ["app"]
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://solin-db:5432/solindb
      DB_USER: solin
      DB_PASSWORD: ${DB_PASSWORD:-solin123}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      solin-db:
        condition: service_healthy

volumes:
  solin-db-data:
